name: stale

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale issues and PRs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: "This issue has been inactive for 30 days and is marked as stale. It will be closed in 7 days unless there is new activity."
          stale-pr-message: "This pull request has been inactive for 30 days and is marked as stale. It will be closed in 7 days unless there is new activity."
          close-issue-message: "This issue was closed due to inactivity. Feel free to reopen if still relevant."
          close-pr-message: "This pull request was closed due to inactivity. Feel free to reopen if still relevant."
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,in-progress"
          exempt-pr-labels: "pinned,in-progress"
