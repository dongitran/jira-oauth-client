name: ci

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish jira-oauth-client to npm
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "README.md"
      - "tsconfig.json"
      - "tsup.config.ts"
      - "vitest.config.ts"
      - "playwright.config.ts"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "README.md"
      - "tsconfig.json"
      - "tsup.config.ts"
      - "vitest.config.ts"
      - "playwright.config.ts"

permissions:
  contents: read

concurrency:
  group: jira-oauth-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and verify jira-oauth-client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:unit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests (mock Atlassian)
        run: pnpm test:e2e:mock

      - name: Verify publish tarball
        run: npm pack --dry-run

  publish:
    name: Publish jira-oauth-client to npm
    runs-on: ubuntu-latest
    needs: ci
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check whether version is already published
        id: publish_check
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version ${package_version} is already published. Skipping npm publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.publish_check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
